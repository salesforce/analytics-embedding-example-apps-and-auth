name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: react-vite
            dir: examples/react-vite
            build: true
          - example: vanilla-js
            dir: examples/vanilla-js
            build: false
          - example: angular
            dir: examples/angular
            build: true

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lock files aren't committed yet (platform-mismatch issue between
      # darwin-arm64 dev machines and linux-x64 CI). Track in #follow-up:
      # generate Linux-compatible locks once we have a CI workflow that does it.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        if: ${{ matrix.build }}
        run: npm run build
