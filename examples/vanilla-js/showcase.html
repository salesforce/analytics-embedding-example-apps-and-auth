<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Showcase page — Dashboard, Metric, and Visualization mounted via @salesforce/analytics-embedding-sdk custom elements."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https:;
               connect-src 'self' https://*.lightning.force.com https://*.salesforce.com https://*.my.salesforce.com https://*.tableau.com;
               frame-src https://*.lightning.force.com https://*.salesforce.com https://*.tableau.com;
               base-uri 'self';"
    />
    <title>Showcase — Analytics Embedding SDK (Vanilla example)</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="modulepreload"
      href="https://cdn.jsdelivr.net/npm/@salesforce/analytics-embedding-sdk@1/dist/sdk-bundle.module.js"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app-header"></div>
    <main id="main" class="app">
      <header class="page-header">
        <h1>Showcase</h1>
        <p>
          A dashboard, a metric, and a single visualization rendered using the
          SDK's <strong>HTML custom-element API</strong>. Click
          <em>Apply demo filter</em> to push a filter into the dashboard
          programmatically.
        </p>
      </header>

      <p id="status" class="loading"></p>
      <div id="error-host"></div>

      <div class="showcase__actions">
        <button id="apply-filter" type="button" class="btn" disabled>
          Apply demo filter (Region = West)
        </button>
      </div>

      <div class="showcase__grid">
        <!--
          Replace id-or-api-name attributes with assets from your own org.
          The custom elements upgrade once the SDK module loads.
        -->
        <analytics-dashboard
          id="dashboard"
          id-or-api-name="YourDashboardApiName"
          role="region"
          aria-label="Sales dashboard"
          aria-busy="true"
          class="embed embed--dashboard"
        ></analytics-dashboard>
        <analytics-metric
          id="metric"
          id-or-api-name="YourMetricApiName"
          role="region"
          aria-label="Headline metric"
          aria-busy="true"
          class="embed embed--metric"
        ></analytics-metric>
        <analytics-visualization
          id="viz"
          id-or-api-name="YourVisualizationApiName"
          role="region"
          aria-label="Single visualization"
          aria-busy="true"
          class="embed embed--viz"
        ></analytics-visualization>
      </div>
    </main>
    <script type="module" src="./js/showcase-page.js"></script>
  </body>
</html>
